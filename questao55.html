<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 55</title>
    </head>
    <body>

        <script>
            let num, i, cont = 0;

            num = parseInt(prompt("Digite um número: "));

            for (i = 1; i <= num; i++) {
                if (num % i == 0) {
                    cont = cont + 1;
                }
            }

            if (cont == 2) {
                console.log("O número é primo!");
            } else {
                console.log("O número não é primo!");
            }
        </script>

    </body>
</html>
