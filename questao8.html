<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 8</title>
    </head>
    <body>

        <script>
            let a, b, c, delta, x1, x2;

            a = parseFloat(prompt("Digite o valor de A: "));
            b = parseFloat(prompt("Digite o valor de B: "));
            c = parseFloat(prompt("Digite o valor de C: "));

            delta = (b * b) - (4 * a * c);

            if (delta < 0) {
                console.log("Não existem raízes reais!");
            } else if (delta == 0) {
                x1 = -b / (2 * a);

                console.log("Existe apenas uma raiz real!");
                console.log("X = " + x1);
            } else {
                x1 = (-b + Math.sqrt(delta)) / (2 * a);
                x2 = (-b - Math.sqrt(delta)) / (2 * a);

                console.log("X1 = " + x1);
                console.log("X2 = " + x2);
            }
        </script>

    </body>
</html>
