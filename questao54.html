<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 54</title>
    </head>
    <body>

        <script>
            let num, expoente, resultado = 1, i;

            num = parseFloat(prompt("Digite a base: "));
            expoente = parseInt(prompt("Digite o expoente: "));

            for (i = 1; i <= expoente; i++) {
                resultado = resultado * num;
            }

            console.log("Resultado: " + resultado);
        </script>

    </body>
</html>
