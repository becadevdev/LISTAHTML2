<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 5</title>
    </head>

    <body>

        <script>
            let peso, altura, imc;

            peso = parseFloat(prompt("Digite o peso: "));
            altura = parseFloat(prompt("Digite a altura: "));

            imc = peso / (altura * altura);

            console.log("O IMC é: " + imc);
        </script>

    </body>
</html>
