<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 10</title>
    </head>
    <body>

        <script>
            let a, b, c, h, perimetro, area;

            a = parseFloat(prompt("Digite o lado A: "));
            b = parseFloat(prompt("Digite o lado B: "));
            c = parseFloat(prompt("Digite o lado C: "));
            h = parseFloat(prompt("Digite a altura: "));

            perimetro = a + b + c;
            area = (b * h) / 2;

            console.log("Perímetro: " + perimetro);
            console.log("Área: " + area);
        </script>

    </body>
</html>
