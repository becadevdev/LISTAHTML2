<!DOCTYPE html>

<html lang="pt-BR">

    <body>

        <script>
            let raio, area;

            raio = parseFloat(prompt("Digite o raio do círculo: "));

            area = Math.PI * raio * raio;

            console.log("A área é: " + area);
        </script>
