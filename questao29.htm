<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 29</title>
    </head>
    <body>

        <script>
            let num;

            num = parseInt(prompt("Digite um número: "));

            if (num % 2 == 0) {
                console.log("O número é par!");
            } else {
                console.log("O número é ímpar!");
            }
        </script>

    </body>
</html>
