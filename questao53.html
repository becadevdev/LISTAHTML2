<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 53</title>
    </head>
    <body>

        <script>
            let i, soma = 0;

            for (i = 1; i <= 100; i++) {

                if (i % 2 == 0) {
                    soma = soma + i;
                }
            }

            console.log("A soma dos números pares é: " + soma);
        </script>

    </body>
</html>
