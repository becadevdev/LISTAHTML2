<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 35</title>
    </head>
    <body>

        <script>
            let num1, num2, num3, maior, menor;

            num1 = parseFloat(prompt("Digite o primeiro número: "));
            num2 = parseFloat(prompt("Digite o segundo número: "));
            num3 = parseFloat(prompt("Digite o terceiro número: "));

            maior = num1;
            menor = num1;

            if (num2 > maior) {
                maior = num2;
            }

            if (num3 > maior) {
                maior = num3;
            }

            if (num2 < menor) {
                menor = num2;
            }

            if (num3 < menor) {
                menor = num3;
            }

            console.log("Maior: " + maior);
            console.log("Menor: " + menor);
        </script>

    </body>
</html>
