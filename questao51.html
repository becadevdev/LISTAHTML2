<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 51</title>
    </head>
    <body>

        <script>
            let num, i;

            for (num = 1; num <= 10; num++) {

                console.log("Tabuada do " + num);

                for (i = 1; i <= 10; i++) {
                    console.log(num + " x " + i + " = " + (num * i));
                }
            }
        </script>

    </body>
</html>
