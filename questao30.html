<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 30</title>
    </head>
    <body>

        <script>
            let num;

            num = parseFloat(prompt("Digite um número: "));

            if (num > 0) {
                console.log("O número é positivo!");
            } else if (num < 0) {
                console.log("O número é negativo!");
            } else {
                console.log("O número é zero!");
            }
        </script>

    </body>
</html>
