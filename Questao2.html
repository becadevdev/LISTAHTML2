<!DOCTYPE html>

<html lang="pt-BR">

        <title>Questão 2</title>

    <body>

        <script>
            let num1, num2, media;

            num1 = parseFloat(prompt("Digite o primeiro número: "));
            num2 = parseFloat(prompt("Digite o segundo número: "));

            media = (num1 + num2) / 2;

            console.log("A média é: " + media);
