<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 6</title>
    </head>
    <body>

        <script>
            let raio, perimetro;

            raio = parseFloat(prompt("Digite o raio do círculo: "));

            perimetro = 2 * Math.PI * raio;

            console.log("O perímetro é: " + perimetro);
        </script>

    </body>
</html>
