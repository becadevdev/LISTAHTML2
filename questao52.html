<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 52</title>
    </head>
    <body>

        <script>
            let n, i, soma = 0;

            n = parseInt(prompt("Digite um número N: "));

            for (i = 1; i <= n; i++) {
                soma = soma + i;
            }

            console.log("A soma é: " + soma);
        </script>

    </body>
</html>
