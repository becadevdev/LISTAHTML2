<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 31</title>
    </head>
    <body>

        <script>
            let nota1, nota2;

            nota1 = parseFloat(prompt("Digite a nota da primeira prova: "));
            nota2 = parseFloat(prompt("Digite a nota da segunda prova: "));

            if (nota1 >= 6) {
                console.log("Aprovado na primeira prova!");
            } else {
                console.log("Reprovado na primeira prova!");
            }

            if (nota2 >= 6) {
                console.log("Aprovado na segunda prova!");
            } else {
                console.log("Reprovado na segunda prova!");
            }
        </script>

    </body>
</html>
