<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Questão 33</title>
    </head>
    <body>

        <script>
            let num1, num2, num3, soma;

            num1 = parseFloat(prompt("Digite o primeiro número: "));
            num2 = parseFloat(prompt("Digite o segundo número: "));
            num3 = parseFloat(prompt("Digite o terceiro número: "));

            soma = num1 + num2 + num3;

            if (soma % 5 == 0) {
                console.log("A soma é divisível por 5!");
            } else {
                console.log("A soma não é divisível por 5!");
            }
        </script>

    </body>
</html>
