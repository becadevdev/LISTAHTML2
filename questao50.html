<!DOCTYPE html>

<html lang="pt-BR">

        <meta charset="UTF-8">
        <title>Questão 50</title>

    <body>

        <script>
            let num, i;

            num = parseInt(prompt("Digite um número: "));

            for (i = 1; i <= 10; i++) {
                console.log(num + " x " + i + " = " + (num * i));
            }
        </script>
